[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hhs-nofo-metrics"
version = "0.5.1"
description = "Versioned, reproducible readability metrics for HHS NOFO documents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Agile Six Applications, Inc." }]
requires-python = ">=3.11"
dependencies = [
  "pdfplumber>=0.11,<1",
  "pypdf>=5,<7",
]

[project.urls]
Homepage = "https://github.com/mikec-ai/hhs-nofo-metrics"
Repository = "https://github.com/mikec-ai/hhs-nofo-metrics"
Issues = "https://github.com/mikec-ai/hhs-nofo-metrics/issues"
Changelog = "https://github.com/mikec-ai/hhs-nofo-metrics/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "jsonschema>=4.23,<5",
  "pre-commit>=4.6,<5",
  "pytest>=8,<9",
  "pytest-cov>=7.1,<8",
  "ruff>=0.16,<0.17",
]

[project.scripts]
hhs-nofo-metrics = "hhs_nofo_metrics_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true
py-modules = ["hhs_nofo_metrics_cli"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hhs_nofo_metrics = [
  "profiles/*.json",
  "schemas/analysis-result-1.1.0.json",
  "schemas/analysis-result-1.2.0.json",
  "schemas/profile-1.1.0.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["hhs_nofo_metrics"]

[tool.coverage.report]
fail_under = 84
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
